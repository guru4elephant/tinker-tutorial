apply plugin: 'com.android.application'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.example.tinker"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        multiDexEnabled true
    }

    signingConfigs {
        release {
            storeFile file('keystore/release.jks')
            storePassword 'tinker_demo'
            keyAlias 'tinker_demo'
            keyPassword 'tinker_demo'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    dexOptions {
        jumboMode = true
    }
}

dependencies {
    // Tinker 核心库
    implementation "com.tencent.tinker:tinker-android-lib:${rootProject.ext.tinkerVersion}"
    // Tinker 注解处理器
    annotationProcessor "com.tencent.tinker:tinker-android-anno:${rootProject.ext.tinkerVersion}"
    // MultiDex
    implementation 'androidx.multidex:multidex:2.0.1'
    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
}

// ==============================
// Tinker 补丁构建配置
// ==============================

def bakPath = file("${buildDir}/bakApk/")

// 注意：构建补丁时需要修改这里，指向基线包路径
ext {
    // 基线 APK 文件名（需要手动更新）
    tinkerOldApkPath = "${bakPath}/app-debug-0322.apk"
    // 基线 mapping 文件（Release 构建时使用）
    tinkerApplyMappingPath = "${bakPath}/app-debug-0322-mapping.txt"
    // 基线 R.txt 文件
    tinkerApplyResourcePath = "${bakPath}/app-debug-0322-R.txt"
}

// 应用 Tinker 插件（必须在 android {} 之后）
apply plugin: 'com.tencent.tinker.patch'

tinkerPatch {
    oldApk = tinkerOldApkPath
    ignoreWarning = false
    useSign = true

    buildConfig {
        applyMapping = tinkerApplyMappingPath
        applyResourceMapping = tinkerApplyResourcePath
        tinkerId = "tinker-demo-1.0.0"
        keepDexApply = false
        isProtectedApp = false
        supportHotplugComponent = false
    }

    dex {
        dexMode = "jar"
        pattern = ["classes*.dex", "assets/secondary-dex-?.jar"]
        loader = [
            "com.example.tinker.MyApplication"
        ]
    }

    lib {
        pattern = ["lib/*/*.so"]
    }

    res {
        pattern = ["res/*", "assets/*", "resources.arsc", "AndroidManifest.xml"]
        ignoreChange = ["assets/sample_meta.txt"]
        largeModSize = 100
    }

    packageConfig {
        configField("patchMessage", "")
        configField("platform", "all")
        configField("patchVersion", "1.0.0")
    }

    sevenZip {
        zipArtifact = "com.tencent.mm:SevenZip:1.1.10"
    }
}

// ==============================
// 基线包备份任务
// ==============================
android.applicationVariants.all { variant ->
    def taskName = variant.name

    tasks.all {
        if ("assemble${taskName.capitalize()}".equalsIgnoreCase(it.name)) {
            it.doLast {
                def date = new Date().format("MMdd-HH-mm-ss")

                // 备份 APK
                copy {
                    from "${buildDir}/outputs/apk/${taskName}"
                    into bakPath
                    rename { String fileName ->
                        fileName.replace("${project.name}-${taskName}",
                            "${project.name}-${taskName}-${date}")
                    }
                }

                // 备份 mapping.txt
                copy {
                    from "${buildDir}/outputs/mapping/${taskName}/mapping.txt"
                    into bakPath
                    rename { "app-${taskName}-${date}-mapping.txt" }
                }
            }
        }
    }
}
